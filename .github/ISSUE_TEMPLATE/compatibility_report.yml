name: Compatibility report
description: It works (or not) on a setup the author has not tested
labels: ["compatibility"]
body:
  - type: input
    id: godot
    attributes: {label: Godot version}
    validations: {required: true}
  - type: input
    id: platform
    attributes: {label: OS and GPU}
    validations: {required: true}
  - type: dropdown
    id: renderer
    attributes: {label: Renderer, options: [GL Compatibility, Mobile, Forward+]}
    validations: {required: true}
  - type: dropdown
    id: result
    attributes: {label: Result, options: [Works fine, Works with problems, Does not work]}
    validations: {required: true}
  - type: textarea
    id: notes
    attributes: {label: Notes}
