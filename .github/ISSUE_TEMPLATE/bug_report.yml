name: Bug report
description: A model imports wrongly, or the plugin errors
labels: ["bug"]
body:
  - type: input
    id: plugin
    attributes: {label: Plugin version, placeholder: "1.1.0"}
    validations: {required: true}
  - type: input
    id: godot
    attributes: {label: Godot version, placeholder: "4.7.2 stable"}
    validations: {required: true}
  - type: input
    id: platform
    attributes: {label: OS and GPU}
    validations: {required: true}
  - type: input
    id: blockbench
    attributes: {label: Blockbench version and model format, placeholder: "5.0, Free Model"}
    validations: {required: true}
  - type: textarea
    id: what
    attributes: {label: What happened, and what did you expect?}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: textarea
    id: output
    attributes: {label: Output panel messages, description: Import warnings and errors, render: text}
  - type: checkboxes
    id: checks
    attributes:
      label: Checked
      options:
        - label: I read Troubleshooting and Known issues
          required: true
        - label: I only attached files I have the right to share
          required: true
